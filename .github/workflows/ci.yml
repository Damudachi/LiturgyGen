name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, and current LTS.
        node: ['20.10', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No native modules: `pg` is pure JavaScript and the tests run against
      # pg-mem in-process, so CI needs neither a compiler nor a database.
      - run: npm ci

      # The office's transcriptions are deliberately not in the repository, so
      # CI seeds the placeholder set alone. That is the same path a fresh clone
      # takes, which is exactly what is worth testing here.
      - run: npm run test:server

      - run: npm run test:client

      - run: npm run build
